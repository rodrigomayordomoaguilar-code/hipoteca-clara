<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Calcula la cuota mensual estimada de una hipoteca en España."><title>Calculadora de cuota hipotecaria — Hipoteca Clara</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="brand" href="index.html">Hipoteca<span>Clara</span></a><a class="back-link" href="index.html#herramientas">← Todas las herramientas</a></header><main><section class="page-hero"><p class="eyebrow">CALCULADORA DE CUOTA</p><h1>¿Cuál sería tu cuota mensual?</h1><p>Simula una cuota por el sistema francés con capital, tipo nominal y plazo.</p></section><section class="simple-calculator"><div class="calculator-grid"><form data-tool="quota"><div class="field-group"><label for="quota-principal">Importe de la hipoteca</label><div class="input-suffix"><input id="quota-principal" value="200000" type="number" min="1" step="1000"><span>€</span></div></div><div class="two-fields"><div class="field-group"><label for="quota-rate">Tipo nominal</label><div class="input-suffix"><input id="quota-rate" value="2.75" type="number" min="0" step="0.01"><span>%</span></div></div><div class="field-group"><label for="quota-years">Plazo</label><div class="input-suffix"><input id="quota-years" value="25" type="number" min="1" max="50"><span>años</span></div></div></div></form><aside class="result-card"><p class="result-label">CUOTA MENSUAL ESTIMADA</p><p class="monthly-payment" id="quota-payment">—</p><hr><dl class="result-breakdown"><div><dt>Intereses estimados</dt><dd id="quota-interest">—</dd></div><div><dt>Total a devolver</dt><dd id="quota-total">—</dd></div></dl></aside></div></section></main><footer><span>© 2026 Hipoteca Clara</span><span>Estimación informativa</span></footer><script src="tools.js"></script></body></html>
